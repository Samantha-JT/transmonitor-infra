name: Deploy Transmonitor

on:
  push:
    branches: [trans-variant-foundation]

env:
  AWS_REGION: eu-west-1
  TF_VAR_FILE: transmonitor.tfvars

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Vite frontend
        run: npm run build
        env:
          VITE_VARIANT: trans
          VITE_API_BASE: https://${{ secrets.HOSTNAME }}/api

      - name: Build Lambda handlers
        run: npm run build:lambda
        # Assumes package.json has a build:lambda script that tsc-compiles
        # lambda_src/* and outputs to lambda_src/*/dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.8"

      - name: Write tfvars
        run: |
          cat > transmonitor-infra/transmonitor.tfvars <<EOF
          aws_region           = "${{ env.AWS_REGION }}"
          environment          = "prod"
          cloudflare_api_token = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          cloudflare_zone_id   = "${{ secrets.CLOUDFLARE_ZONE_ID }}"
          hostname             = "${{ secrets.HOSTNAME }}"
          origin_verify_secret = "${{ secrets.ORIGIN_VERIFY_SECRET }}"
          groq_api_key         = "${{ secrets.GROQ_API_KEY }}"
          openrouter_api_key   = "${{ secrets.OPENROUTER_API_KEY }}"
          EOF

      - name: Terraform init
        working-directory: transmonitor-infra
        run: terraform init

      - name: Terraform apply
        working-directory: transmonitor-infra
        run: terraform apply -auto-approve -var-file=transmonitor.tfvars

      - name: Sync frontend to S3
        run: |
          BUCKET=$(cd transmonitor-infra && terraform output -raw s3_bucket_name)
          aws s3 sync dist/ s3://$BUCKET/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://$BUCKET/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Purge Cloudflare cache
        run: |
          curl -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
