name: Deploy Transmonitor

on:
  push:
    branches: [trans-variant-foundation]

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Lambda handlers
        run: npm run build:lambda

      - name: Build Vite frontend
        run: npm run build
        env:
          VITE_VARIANT: trans
          VITE_API_BASE: https://${{ secrets.HOSTNAME }}/api

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Write tfvars
        working-directory: transmonitor-infra
        run: |
          cat > transmonitor.tfvars <<EOF
          aws_region            = "${{ env.AWS_REGION }}"
          environment           = "prod"
          cloudflare_api_token  = "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          cloudflare_zone_id    = "${{ secrets.CLOUDFLARE_ZONE_ID }}"
          cloudflare_account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          hostname              = "${{ secrets.HOSTNAME }}"
          origin_verify_secret  = "${{ secrets.ORIGIN_VERIFY_SECRET }}"
          groq_api_key          = "${{ secrets.GROQ_API_KEY }}"
          openrouter_api_key    = "${{ secrets.OPENROUTER_API_KEY }}"
          EOF

      - name: Terraform init
        working-directory: transmonitor-infra
        run: terraform init

      - name: Terraform validate
        working-directory: transmonitor-infra
        run: terraform validate

      - name: Terraform plan
        working-directory: transmonitor-infra
        run: terraform plan -var-file=transmonitor.tfvars -out=tfplan

      - name: Terraform apply
        working-directory: transmonitor-infra
        run: terraform apply tfplan

      - name: Sync frontend to S3
        working-directory: transmonitor-infra
        run: |
          BUCKET=$(terraform -chdir=. output -raw s3_bucket_name)
          echo "Deploying to s3://$BUCKET"
          aws s3 sync ../dist/ s3://$BUCKET/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp ../dist/index.html s3://$BUCKET/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Purge Cloudflare cache
        run: |
          curl --fail -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
